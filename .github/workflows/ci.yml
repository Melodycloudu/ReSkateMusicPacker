name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Install ffmpeg (needed by the artwork tests)
        run: |
          choco install ffmpeg -y --no-progress
          ffmpeg -version

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  # macOS and Linux: SDL2 GUI, ooz for Oodle blocks. Warnings are errors here as with MSVC.
  build-test-posix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest   # Apple Silicon
          - os: ubuntu-24.04   # x86-64, GCC
          - os: ubuntu-24.04
            cxx: clang++
            cc: clang
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2 and ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2 ffmpeg

      - name: Install SDL2 and ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev ffmpeg fonts-dejavu-core

      - name: Configure
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DRSMP_WARNINGS_AS_ERRORS=ON
          ${{ matrix.cxx && format('-DCMAKE_CXX_COMPILER={0} -DCMAKE_C_COMPILER={1}', matrix.cxx, matrix.cc) || '' }}

      - name: Build
        run: cmake --build build -j 4

      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error

  # pack() encodes songs on a thread pool, and ThreadSanitizer is the only thing that reliably
  # catches a race in it. This job covers the tests that run without a game install: the engine's
  # own code (CAS decode, JSON, EBX/TOC) and the library entry points that reach it. pack() itself
  # needs a ReSkate install to read its template assets, which cannot live in CI, so its end-to-end
  # half is skipped here; run it locally against an install with:
  #   cmake -B build-tsan -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang
  #         -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_FLAGS="-fsanitize=thread -g -O1"
  #         -DCMAKE_CXX_FLAGS="-fsanitize=thread -g -O1" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
  #   cmake --build build-tsan --target ReSkateMusicPackerTests
  #   ./build-tsan/ReSkateMusicPackerTests "F:\Games\ReSkate-1.0.0"
  # Only the test targets are built: the GUI app and imgui are third-party code that reports races
  # of its own and are not what this job is for.
  tsan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2, ffmpeg and a font
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libsdl2-dev ffmpeg fonts-dejavu-core

      - name: Configure (Debug, TSan)
        run: >-
          cmake -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_C_FLAGS="-fsanitize=thread -g -O1"
          -DCMAKE_CXX_FLAGS="-fsanitize=thread -g -O1"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"

      - name: Build the tests
        run: >-
          cmake --build build -j 4 --target
          ReSkateMusicPackerTests ReSkateArtworkTests
          ReSkateFfmpegTests ReSkateCasCodecTests

      - name: Test under ThreadSanitizer
        run: ctest --test-dir build --output-on-failure --no-tests=error
